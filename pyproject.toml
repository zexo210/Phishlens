[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishlens"
version = "0.1.0"
description = "Explainable phishing e-mail triage for .eml files (stdlib core, optional AI second opinion)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ai = ["anthropic"]
dev = ["pytest"]

[project.scripts]
phishlens = "phishlens.cli:main"

[tool.setuptools]
packages = ["phishlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
